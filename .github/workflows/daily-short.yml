name: Build and upload private Short
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 13:30 UTC = 19:00 Asia/Kolkata
    - cron: "30 13 * * *"
permissions:
  contents: write
concurrency:
  group: daily-stoic-short
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: Install FFmpeg and eSpeak
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Generate and upload privately if OAuth secrets exist
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          if [ -n "$YOUTUBE_CLIENT_ID" ] && [ -n "$YOUTUBE_CLIENT_SECRET" ] && [ -n "$YOUTUBE_REFRESH_TOKEN" ]; then
            python -m stoic_shorts --output output --upload
          else
            echo "OAuth secrets missing; generate-only mode."
            python -m stoic_shorts --output output
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stoic-short-${{ github.run_id }}
          path: |
            output/short.mp4
            output/thumbnail.png
            output/script.txt
            output/metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Save duplicate-prevention history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record generated Short"
            git push
          fi
