name: Build and upload private Short

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-short.yml"
      - "stoic_shorts/**"
      - "tests/**"
      - "requirements.txt"
      - "README.md"
  workflow_dispatch:
  schedule:
    # 13:30 UTC = 19:00 Asia/Kolkata
    - cron: "30 13 * * *"

permissions:
  contents: write

concurrency:
  group: daily-stoic-short
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install video and Hindi font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Generate and upload privately when OAuth is configured
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          YOUTUBE_CLIENT_ID: \${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: \${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: \${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing. Add it in repository Actions secrets."
            exit 1
          fi

          if [ -n "$YOUTUBE_CLIENT_ID" ] && [ -n "$YOUTUBE_CLIENT_SECRET" ] && [ -n "$YOUTUBE_REFRESH_TOKEN" ]; then
            python -m stoic_shorts --output output --upload
          else
            echo "YouTube OAuth secrets are incomplete; generating a review-only artifact."
            python -m stoic_shorts --output output
          fi

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stoic-short-\${{ github.run_id }}
          path: |
            output/short.mp4
            output/thumbnail.png
            output/script.txt
            output/captions.srt
            output/metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Save duplicate-prevention history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record generated Short"
            git push
          fi
